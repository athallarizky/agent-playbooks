name: guardian-sweep

# Central guardian: hourly IOC sweep across ALL repos from OUTSIDE them, so an
# attacker holding a write token on any victim repo cannot disable this by
# pushing to that repo. Read-only by design: the sweep PAT cannot modify your
# repos; findings raise an issue here (email notification to watchers).
# Setup: repo secret GUARD_PAT = fine-grained PAT, Contents: Read (all repos).

on:
  schedule:
    # every 30 minutes, 4 independent slots (public repo = unlimited Actions
    # minutes). GitHub drops scheduled runs under load (3 of 5 dropped
    # 2026-10-20) — redundant slots make a silent window far less likely.
    - cron: "17 * * * *"
    - cron: "47 * * * *"
    - cron: "2 * * * *"
    - cron: "32 * * * *"
  workflow_dispatch:
    inputs:
      test_notify:
        description: "Kirim test notifikasi Telegram lalu berhenti (uji kanal)"
        type: boolean
        default: false
      orgs:
        description: "Orgs manual (spasi-pisah) — kosong = default (personal + The-Aetheris); all = semua org kecuali kitabisa. Contoh: gaspack-launchpad 2pai-dev 2PAI-TEN"
        type: string
        default: ""

permissions:
  issues: write   # alerting only; no repo contents are ever modified

concurrency:
  group: guardian-sweep
  cancel-in-progress: false

env:
  ORGS: "The-Aetheris"     # orgs to include, space-separated

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Sweep every branch of every repo for campaign IOCs
        env:
          PAT: ${{ secrets.GUARD_PAT }}
          SALT: ${{ secrets.GUARD_SALT }}
          ALERT_TOKEN: ${{ github.token }}
          GUARDIAN: ${{ github.repository }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_THREAD_ID: ${{ secrets.TG_THREAD_ID }}
          TEST_NOTIFY: ${{ github.event.inputs.test_notify }}
          ORGS_INPUT: ${{ github.event.inputs.orgs }}
        run: |
          set -u
          set +e   # the runner invokes bash -e; this script handles errors explicitly
          if [ -z "${PAT:-}" ]; then
            echo "::error title=GUARD_PAT kosong::secret GUARD_PAT belum diisi (set ulang: gh secret set GUARD_PAT -R athallarizky/guardian)"
            exit 1
          fi
          if [ -z "${SALT:-}" ]; then
            echo "::error title=GUARD_SALT kosong::secret GUARD_SALT belum diisi (guardian-map.sh butuh salt yang sama untuk resolve kode)"
            exit 1
          fi
          # repo names are MASKED in all output: alerts show only R-<8hex> =
          # sha256(full_name + SALT) prefix. Resolve locally: grep the code in
          # your guardian map (scripts/guardian-map.sh, same salt).
          code_of() { printf '%s%s' "$1" "$SALT" | sha256sum | cut -c1-8; }
          findings=""
          findings_plain=""   # TG (private group) gets real names; the PUBLIC issue stays masked

          # Telegram channel — silent (no-op) until TG_BOT_TOKEN/TG_CHAT_ID exist
          notify_tg() {
            [ -z "${TG_BOT_TOKEN:-}" ] || [ -z "${TG_CHAT_ID:-}" ] && return 0
            local t="$1"; [ ${#t} -gt 3500 ] && t="${t:0:3500} …(truncated - full list in the issue)"
            local args=(-s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" -d chat_id="${TG_CHAT_ID}" -d text="$t" --max-time 20)
            [ -n "${TG_THREAD_ID:-}" ] && args+=(-d message_thread_id="${TG_THREAD_ID}")
            curl "${args[@]}" >/dev/null || true
          }
          if [ "${TEST_NOTIFY:-false}" = "true" ]; then
            notify_tg "✅ guardian test notification — kanal OK ($(date -u '+%F %T') UTC)"
            echo "test notification sent (or skipped: secrets empty)."
            exit 0
          fi

          scan_ref() {  # $1=repo $2=branch  (accumulates into $findings, single-line entries joined by ~)
            local repo="$1" br="$2" rc tree size path ep c v d
            # every masked append below has a plain twin: scan_ref_p records the
            # same finding with the real repo name for the PRIVATE Telegram alert
            rc="R-$(code_of "$repo")"
            # fadd records a finding in BOTH tracks: masked (public issue) and
            # plain-name (private Telegram). Called as the last element of a
            # && chain so it only fires when the detection actually matched.
            fadd() { findings="$findings~$rc@$br :: $1"; findings_plain="$findings_plain~$repo@$br :: $1"; }
            tree=$(GH_TOKEN="$PAT" gh api "repos/$repo/git/trees/$br?recursive=1" --jq '.tree[] | select(.type=="blob") | "\(.size)\t\(.path)"' 2>/dev/null)
            # gh api prints error bodies (404/403) to STDOUT — a failed fetch
            # must ALERT, never silently skip the ref (silent skip = blind spot)
            if [ -z "$tree" ] || printf '%s' "$tree" | grep -q '^{.message'; then
              fadd "SCAN-ERROR (tree fetch failed - deleted repo? rate limit?)"
              return 0
            fi
            while IFS=$'\t' read -r size path; do
              [ -z "${path:-}" ] && continue
              case "$path" in
                .vscode/*|*/.vscode/*) fadd "$path (.vscode on remote - policy: none allowed)"; continue ;;
                *public/fonts/*|*public/font/*) fadd "$path (planted public/fonts dir - policy: none allowed)"; continue ;;
                # python EtherHiding loader class (utils/transport.py, 2026-10-26)
                transport.py|*/transport.py|payload.py|*/payload.py|loader.py|*/loader.py) ;;
                api.js|*/api.js|.env|*/.env|config.bat|*/config.bat|.gitignore|*.config.js|*.config.ts|*.config.mjs|*.config.cjs|*.config.mts|*.config.cts|*.conf.js|*.conf.ts|*.conf.mjs|*.conf.cjs|.eslintrc*|*/.eslintrc*|.prettierrc*|*/.prettierrc*|.postcssrc*|*/.postcssrc*|.babelrc*|*/.babelrc*|.stylelintrc*|*/.stylelintrc*|package.json|scripts/*.ts|scripts/*.js|scripts/*.mjs|index.ts|*/index.ts|main.ts|*/main.ts|app.ts|*/app.ts|server.ts|*/server.ts|cli.ts|*/cli.ts|index.js|*/index.js|main.js|*/main.js|server.js|*/server.js|cli.js|*/cli.js|index.mjs|*/index.mjs|main.mjs|*/main.mjs) ;;
                # campaign font names are size-agnostic: fa-brand-400.orc was
                # 29KB and sailed over the 10KB size gate (2026-10-25)
                fa-brand-[0-9]*|*/fa-brand-[0-9]*|fa-brands-[0-9]*|*/fa-brands-[0-9]*|fa-regular-[0-9]*|*/fa-regular-[0-9]*|fa-solid-[0-9]*|*/fa-solid-[0-9]*) ;;
                # fonts-dir policy: inside ANY fonts/ dir (any depth, spaces in
                # path included) a NON-font extension is always a candidate —
                # the campaign rotates containers (.orc, and next whatever).
                # Legit font exts incl. .ttc (macOS TrueType Collections) pass.
                *fonts/*)
                  case "$path" in
                    *.woff|*.woff2|*.ttf|*.otf|*.eot|*.svg|*.ttc) [ "${size:-0}" -lt 10240 ] || continue ;;
                    *) ;;   # non-font ext in fonts dir: candidate, any size
                  esac ;;
                *.woff|*.woff2|*.ttf|*.otf|*.eot|*.orc) [ "${size:-0}" -lt 10240 ] || continue ;;
                *) continue ;;
              esac
              # paths may contain spaces ("TP Mod 3/…") — percent-encode for the
              # contents API or it 404s and the file reads as invisible
              ep="${path// /%20}"
              c=$(GH_TOKEN="$PAT" gh api "repos/$repo/contents/$ep?ref=$br" --jq '.content' 2>/dev/null | base64 -d 2>/dev/null) || continue
              # okshanaby loader is WHOLE-TREE: AUTH_API_KEY can never be
              # legitimate in any file, at any path (2026-10-25 lesson)
              if printf '%s' "$c" | grep -q 'atob(process\.env\.AUTH_API_KEY)'; then
                fadd "$path (okshanaby loader)"; continue
              fi
              case "$path" in
                api.js|*/api.js)
                  echo "$c" | grep -qF '/.{1,2}/g' && echo "$c" | grep -q TextDecoder && fadd "$path (obfuscated JS droplet)" ;;
                .env|*/.env)
                  while read -r v; do d=$(printf '%s' "$v" | base64 -d 2>/dev/null) || continue
                    case "$d" in http://*|https://*) fadd "$path (env dropper URL: $d)"; break ;; esac
                  done < <(echo "$c" | grep -oE '"[A-Za-z0-9+/=]{16,}"' | tr -d '"') ;;
                config.bat|*/config.bat) fadd "$path (stage-2 dropper)" ;;
                .gitignore) echo "$c" | grep -qxE '\*\.bat|[A-Za-z0-9_.-]+\.bat' && fadd "$path (campaign fingerprint: bat ignore line)" ;;
                *.config.js|*.config.ts|*.config.mjs|*.config.cjs|*.config.mts|*.config.cts|*.conf.js|*.conf.ts|*.conf.mjs|*.conf.cjs|.eslintrc*|*/.eslintrc*|.prettierrc*|*/.prettierrc*|.postcssrc*|*/.postcssrc*|.babelrc*|*/.babelrc*|.stylelintrc*|*/.stylelintrc*)
                  # rider family: original spin/peel/splitLane + CJS shims, plus
                  # the Nx/OmniStealer marker set and the 40-space padding tell
                  echo "$c" | grep -qE 'function (spin|peel|splitLane)\(' && echo "$c" | grep -qE '\(global, ?require\)|var z ?=' && fadd "$path (build-config rider)"
                  echo "$c" | grep -q "createRequire(import.meta.url)" && echo "$c" | grep -q 'var module = { exports: {} }' && fadd "$path (build-config rider: ESM shim)"
                  echo "$c" | grep -qE 'global\[.(_V|_H|_R|e).\] *= *.(vscode-eval|[A-Za-z0-9])' && fadd "$path (build-config rider: Nx/OmniStealer)"
                  echo "$c" | grep -qE 'function sfL\(|_\$af[0-9a-fA-F]{4,}|String\.fromCharCode[[:space:]]*\([[:space:]]*127[[:space:]]*\)' && fadd "$path (build-config rider: obfuscator vars)"
                  echo "$c" | grep -qE ' {40,}var ' && fadd "$path (build-config rider: whitespace padding)" ;;
                package.json)
                  echo "$c" | grep -qE '"(post|pre)install":[[:space:]]*"[^"]*(curl|wget)[^"]*\|[[:space:]]*(sh|bash)|"(post|pre)install":[[:space:]]*"[^"]*node[[:space:]]+-e|"(post|pre)install":[[:space:]]*"[^"]*eval\(' && fadd "$path (npm lifecycle dropper)" ;;
                transport.py|*/transport.py|payload.py|*/payload.py|loader.py|*/loader.py)
                  # two-signal: chain-fetch (ethplorer tx list OR on-chain input
                  # decode) AND execution (subprocess/tempfile)
                  pychain=0; pyexec=0
                  echo "$c" | grep -q getAddressTransactions && pychain=1
                  echo "$c" | grep -q eth_getTransactionByHash && echo "$c" | grep -q fromhex && pychain=1
                  echo "$c" | grep -qE 'import subprocess|subprocess\.' && pyexec=1
                  echo "$c" | grep -qE 'import tempfile|tempfile\.' && pyexec=1
                  [ "$pychain" -eq 1 ] && [ "$pyexec" -eq 1 ] && fadd "$path (python EtherHiding loader)" ;;
                *.woff|*.woff2|*.ttf|*.otf|*.eot|*.orc)
                  echo "$c" | grep -qE '\(function|Function\(|require\(|eval\(|child_process' && fadd "$path (fake font: JS inside font file)"
                  # tier 2: TEXT in a font extension — real fonts are binary,
                  # payloads are printable text; catches keyword-stripped payloads
                  r=$(printf '%s' "$c" | head -c 2048 | LC_ALL=C tr -d '[:print:]\t\r\n' | wc -c)
                  [ "${r// /}" -eq 0 ] && fadd "$path (fake font: text payload, no binary bytes)" ;;
              esac
            done <<< "$tree"
          }

          # manual dispatch may override the org scope (empty = cron default);
          # "all" = every org this account can see
          ACTIVE_ORGS="$ORGS"
          if [ -n "${ORGS_INPUT:-}" ]; then ACTIVE_ORGS="$ORGS_INPUT"; fi
          targets=$(GH_TOKEN="$PAT" gh api --paginate "user/repos?type=owner&per_page=100" --jq '.[] | select(.fork == false) | .full_name' 2>/dev/null) || targets=""
          if [ "$ACTIVE_ORGS" = "all" ]; then
            # kitabisa is excluded: maintained by its own team, out of scope here
            ACTIVE_ORGS=$(GH_TOKEN="$PAT" gh api "user/orgs?per_page=100" --jq '[.[].login | select(. != "kitabisa")] | join(" ")' 2>/dev/null)
          fi
          echo "scope: personal + ${ACTIVE_ORGS:-none}"
          for org in $ACTIVE_ORGS; do
            orgrepos=$(GH_TOKEN="$PAT" gh api --paginate "orgs/$org/repos?per_page=100" --jq '.[].full_name' 2>/dev/null) || orgrepos=""
            targets="$targets
          $orgrepos"
          done

          if [ -z "${targets//[$'\n'\r' ']/}" ]; then
            echo "::error title=target-listing gagal::repo listing kosong (rate-limit? cek PAT) — sweep dibatalkan agar tidak false-clean"
            exit 1
          fi

          n=0
          while read -r repo; do
            [ -z "$repo" ] && continue
            while read -r br; do
              [ -z "$br" ] && continue
              scan_ref "$repo" "$br"
              n=$((n+1))
            done < <(GH_TOKEN="$PAT" gh api "repos/$repo/branches?per_page=100" --jq '.[].name' 2>/dev/null)
          done <<< "$targets"

          echo "swept $n refs at $(date -u '+%F %T') UTC"
          if [ -n "$findings" ]; then
            body=$(printf '%s' "$findings" | tr '~' '\n')
            echo "FINDINGS:"; echo "$body"
            # PUBLIC issue stays masked (R-codes); PRIVATE Telegram gets real names
            body_plain=$(printf '%s' "$findings_plain" | tr '~' '\n')
            msg="Automated guardian sweep found campaign indicators or policy violations (.vscode is banned on remote). Repo names are masked as R-codes (salted hash); resolve with: grep R-xxxx ~/.guardian-map.txt Verify and clean with the gh-incident-response playbook (scan-ioc.sh + clean-markers.sh; lift rulesets for protected repos). Do NOT open these paths in an IDE."
            # dedup: if an IOC issue from the last 90 min is still open, comment
            # on it instead of spawning a new one every sweep (48/day at 30-min
            # cadence would bury the signal during a real incident)
            recent=$(GH_TOKEN="$ALERT_TOKEN" gh issue list -R "$GUARDIAN" --state open --search "IOC detected in:title" --json number,createdAt --jq '[.[] | select((now - (.createdAt | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601)) < 5400)] | first(.[]).number // empty' 2>/dev/null)
            if [ -n "$recent" ]; then
              GH_TOKEN="$ALERT_TOKEN" gh issue comment "$recent" -R "$GUARDIAN" -b "Sweep $(date -u '+%F %H:%M') UTC — still finding: $body" >/dev/null 2>&1
              url="existing#$recent"
            else
              url=$(GH_TOKEN="$ALERT_TOKEN" gh issue create -R "$GUARDIAN" -t "IOC detected - sweep $(date -u '+%F %H:%M') UTC" -b "$(printf '%s\n\n%s' "$msg" "$body")")
            fi
            if [ -n "$url" ]; then
              notify_tg "🚨 GUARDIAN — campaign indicators / policy violations found. Issue: $url — $body_plain"
              exit 1
            fi
            notify_tg "🚨 GUARDIAN — FINDINGS DETECTED but issue creation FAILED (names below) — $body_plain"
            echo "::error::findings detected but issue creation failed - see log above"
            exit 1
          fi
          if [ -z "$findings" ] && [ "$(date -u +%H)" = "15" ]; then
            notify_tg "✅ GUARDIAN daily digest — last sweep: $n refs, 0 findings ($(date -u '+%F %T') UTC)"
          fi
          echo "clean."

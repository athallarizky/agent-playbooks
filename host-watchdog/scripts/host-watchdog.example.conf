# ~/.host-watchdog.conf — copy to your home, chmod 600, curate per machine.
# Sourced by scan-host.sh. Private/loopback ranges are always allowed;
# loopback-bound interpreter listeners are always allowed.

# Telegram alerts (same bot as the GitHub guardian; leave empty = silent mode)
TG_BOT_TOKEN=""
TG_CHAT_ID=""
TG_THREAD_ID=""

# Hostnames resolved at scan time (dig +short) — add what YOUR machine talks to
ALLOWED_HOSTS="github.com api.github.com ssh.github.com objects.githubusercontent.com registry.npmjs.org api.telegram.org api.cloudflare.com vercel.com api.vercel.com"

# Bare IPs (CDN ranges etc. that don't resolve cleanly)
ALLOWED_IPS=""

# LISTEN ports you intentionally run (interpreter-owned or public-facing)
ALLOWED_LISTEN_PORTS=""

# Process-name globs (space-separated) whose OUTBOUND remotes and LISTEN ports
# are skipped — browsers talk to the whole internet, system daemons use
# ephemeral ports, so IP/port allowlists can't cover them. lsof truncates names
# (ControlCe, logioptio) — copy the exact name from the WARN line, glob if
# needed. Interpreters are NEVER affected by this list (their CRIT and LISTEN
# logic ignores it) — intentional interpreter listeners go in ALLOWED_LISTEN_PORTS.
ALLOWED_PROCS=""
